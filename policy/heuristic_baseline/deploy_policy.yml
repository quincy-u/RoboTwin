# RoboTwin evaluator settings
policy_name: null
task_name: null
task_config: null
ckpt_setting: heuristic_baseline
seed: null
instruction_type: unseen
test_num: 1

# simple-grasp policy
simple_grasp_root: ~/projects/simple-grasp
object_name: auto
arm: auto
min_confidence: 0.4
max_candidates: 256
pregrasp_offset_m: 0.05
retreat_offset_m: 0.05
max_waypoints_per_segment: 64
max_joint_step_rad: 0.12
gripper_settle_actions: 5
bimanual_max_plans_per_arm: 4
bimanual_lift_m: 0.10
bimanual_collision_step_rad: 0.03
bimanual_max_jaw_axis_alignment: 0.75
bimanual_max_target_width_m: 0.10
mink_solver: daqp
mink_dt: 0.05
mink_max_iterations: 100
mink_position_tolerance_m: 0.001
mink_orientation_tolerance_rad: 0.01
relax_orientation_on_failure: false
canonical_seed_on_failure: true
execution_telemetry: true
execution_guard_enabled: true
execution_guard_qpos_tolerance_rad: 0.10
execution_guard_ee_position_tolerance_m: 0.03
execution_guard_ee_orientation_tolerance_rad: 0.20
execution_guard_gripper_min_delta: 0.08
execution_guard_gripper_settle_delta_max: 0.05
save_grasp_visualizations: true
max_visualized_grasps: null  # null renders every candidate
max_visualized_points: 30000
grasp_visualization_scale: 4

# M2T2
m2t2_checkpoint: checkpoints/m2t2.pth
m2t2_config: third_party/M2T2/config.yaml
device: cuda:0
num_points: 16384
num_object_points: 1024
num_runs: 2
mask_threshold: 0.4
object_threshold: 0.4
max_predictions: 64
workspace_bounds: [-0.5, -0.5, 0.65, 0.5, 0.5, 1.4]
contact_match_distance_m: 0.00001
